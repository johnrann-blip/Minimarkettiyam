name: AVELORA quality checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install backend dependencies
        run: npm --prefix backend install
      - name: Check JavaScript syntax
        run: npm --prefix backend run check
      - name: Run ZarinPal configuration tests
        run: npm --prefix backend run test:zarinpal
