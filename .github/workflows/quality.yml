name: AVELORA quality checks

on:
  push:
    branches: [main, feature/admin-auth-migration]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: u0_a289
          POSTGRES_DB: avelora_integration_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U u0_a289 -d avelora_integration_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install backend dependencies
        run: npm --prefix backend ci
      - name: Initialize isolated integration test database
        run: |
          psql "postgresql://u0_a289@127.0.0.1:5432/avelora_integration_test" -v ON_ERROR_STOP=1 -f database/schema.sql
      - name: Check JavaScript syntax
        run: npm --prefix backend run check
      - name: Run ZarinPal configuration tests
        run: npm --prefix backend run test:zarinpal
      - name: Run Cloudinary upload signing tests
        run: npm --prefix backend run test:cloudinary
      - name: Run PostgreSQL integration tests
        run: npm --prefix backend run test:integration
